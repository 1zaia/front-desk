<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Front Desk · Demo</title>
<style>
  :root { --wall: #e3e6e4; --bg: #f6f7f5; --line: #c9cfcc; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--wall); display: grid; grid-template-columns: minmax(0, 45fr) minmax(0, 55fr); }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  iframe + iframe { border-left: 1px solid var(--line); background: var(--bg); }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-auto-rows: 100vh; height: auto; }
    iframe + iframe { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
  <iframe src="/simulator" title="Voice simulator" allow="microphone; autoplay"></iframe>
  <iframe src="/dashboard" title="Owner dashboard"></iframe>
</body>
</html>
