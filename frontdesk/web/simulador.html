<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Desk · Simulador de voz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --parede: #e3e6e4;
    --moldura: #1d2321;
    --tela: #0d2a31;
    --tela-2: #12363f;
    --anel: #35c6d8;
    --texto-tela: #eef6f5;
    --texto-suave: #8fb3b5;
    --tinta: #1b2422;
    --tinta-suave: #5d6a67;
    --ok: #2f8f5b;
    --erro: #c8372d;
    --linha: #c9cfcc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--parede);
    color: var(--tinta);
    font-family: "Archivo", system-ui, sans-serif;
    font-variation-settings: "wdth" 100;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .coluna { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }

  /* aparelho */
  .aparelho {
    background: var(--moldura);
    border-radius: 28px;
    padding: 18px;
    box-shadow: 0 30px 50px -30px rgba(20, 30, 28, .55);
  }
  .tela {
    position: relative;
    aspect-ratio: 16 / 10;
    border-radius: 14px;
    background: radial-gradient(120% 90% at 0% 0%, var(--tela-2), var(--tela) 60%);
    color: var(--texto-tela);
    padding: clamp(18px, 4vw, 36px);
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }
  .topo { display: flex; justify-content: space-between; align-items: baseline; color: var(--texto-suave); font-size: 15px; }
  .marca { font-variation-settings: "wdth" 125; font-weight: 700; letter-spacing: .02em; color: var(--texto-tela); }
  .conversa { align-self: center; display: grid; gap: 14px; max-width: 34ch; }
  .cliente { color: var(--texto-suave); font-size: clamp(15px, 2vw, 19px); min-height: 1.3em; }
  .cliente.parcial { font-style: italic; }
  .resposta {
    font-size: clamp(22px, 3.6vw, 34px);
    line-height: 1.22;
    font-weight: 500;
    font-variation-settings: "wdth" 92;
    text-wrap: pretty;
  }
  .resposta.erro { color: #ffb4ab; font-size: clamp(17px, 2.4vw, 22px); }

  .faixa { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; }
  .faixa::after {
    content: ""; position: absolute; inset: 0; border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--anel), transparent);
    transform: translateX(-100%); opacity: 0;
  }
  .tela[data-estado="ouvindo"] .faixa::after { opacity: 1; background: var(--anel); transform: none; animation: respirar 1.2s ease-in-out infinite; }
  .tela[data-estado="pensando"] .faixa::after { opacity: 1; animation: varrer 1s linear infinite; }
  .tela[data-estado="falando"] .faixa::after { opacity: .9; background: var(--anel); transform: none; animation: falar .45s ease-in-out infinite alternate; }
  @keyframes respirar { 50% { opacity: .35; } }
  @keyframes varrer { to { transform: translateX(100%); } }
  @keyframes falar { from { transform: scaleX(.55); } to { transform: scaleX(1); } }

  /* controles */
  .controles { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  .microfone {
    width: 56px; height: 56px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--moldura); color: var(--texto-tela); display: grid; place-items: center;
  }
  .microfone:disabled { opacity: .35; cursor: not-allowed; }
  .microfone[aria-pressed="true"] { background: var(--anel); color: var(--moldura); }
  .microfone svg { width: 24px; height: 24px; }
  input[type="text"] {
    font: inherit; font-size: 17px; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--linha); background: #fff; color: var(--tinta); min-width: 0;
  }
  button.enviar, button.nova {
    font: inherit; font-weight: 600; font-size: 15px; padding: 14px 18px; border-radius: 12px;
    border: 0; background: var(--moldura); color: #fff; cursor: pointer;
  }
  button.nova { background: transparent; color: var(--tinta-suave); padding: 6px 0; font-weight: 500; }
  :focus-visible { outline: 3px solid var(--anel); outline-offset: 2px; }
  .dica { font-size: 13px; color: var(--tinta-suave); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* bastidores */
  .bastidores h2 { font-size: 15px; font-weight: 700; margin: 0 0 8px; font-variation-settings: "wdth" 110; }
  .bastidores p.vazio { margin: 0; color: var(--tinta-suave); font-size: 14px; }
  ol.chamadas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  ol.chamadas li {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline;
    background: #fff; border-radius: 10px; padding: 10px 12px; border-left: 4px solid var(--linha);
    font-size: 14px;
  }
  ol.chamadas li.ferramenta { border-left-color: var(--ok); }
  ol.chamadas li.ferramenta.falhou { border-left-color: var(--erro); }
  ol.chamadas li.modelo { border-left-color: var(--anel); }
  .nome { font-weight: 650; }
  .ms { font-variant-numeric: tabular-nums; color: var(--tinta-suave); }
  .args { grid-column: 1 / -1; color: var(--tinta-suave); font-size: 13px; overflow-wrap: anywhere; }
  ol.chamadas li.nova-chamada { animation: chegar .5s ease-out; }
  @keyframes chegar { from { background: #dff6f8; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::after { animation: none !important; }
  }
  @media (max-width: 520px) {
    .controles { grid-template-columns: auto 1fr; }
    button.enviar { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<main class="coluna">
  <section class="aparelho" aria-label="Assistente de voz">
    <div class="tela" id="tela" data-estado="parado">
      <div class="topo"><span class="marca" id="marca">Barbearia Navalha</span><span id="relogio"></span></div>
      <div class="conversa" aria-live="polite">
        <div class="cliente" id="cliente"></div>
        <div class="resposta" id="resposta">Olá! Toque no microfone e peça um horário.</div>
      </div>
      <div class="faixa" aria-hidden="true"></div>
    </div>
  </section>

  <form class="controles" id="form" autocomplete="off">
    <button type="button" class="microfone" id="microfone" aria-pressed="false" aria-label="Falar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input type="text" id="texto" placeholder="Ou digite: quero cortar o cabelo sexta de manhã" aria-label="Fala do cliente">
    <button type="submit" class="enviar">Enviar</button>
  </form>
  <div class="dica"><span id="dica">Barra de espaço também liga o microfone.</span><button type="button" class="nova" id="nova">Nova conversa</button></div>

  <section class="bastidores" aria-labelledby="titulo-bastidores">
    <h2 id="titulo-bastidores">Por trás da fala: chamadas ao servidor MCP</h2>
    <p class="vazio" id="vazio">Cada ferramenta que o agente usar aparece aqui, com os argumentos e o tempo de resposta.</p>
    <ol class="chamadas" id="chamadas"></ol>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const tela = $("tela"), cliente = $("cliente"), resposta = $("resposta");
  const lista = $("chamadas"), vazio = $("vazio"), texto = $("texto"), mic = $("microfone");
  let sessao = null;
  let ocupado = false;

  // relógio do servidor (respeita FRONTDESK_AGORA, usado na gravação da demo)
  const relogio = () => fetch("/api/semana?dias=1", { cache: "no-store" }).then(r => r.json()).then(d => {
    if (d.negocio) $("marca").textContent = d.negocio;
    if (d.agora) $("relogio").textContent = d.agora.slice(11, 16);
  }).catch(() => {});
  relogio(); setInterval(relogio, 30000);

  const estado = (e) => { tela.dataset.estado = e; };

  // ---------- fala (síntese)
  let voz = null;
  const escolherVoz = () => {
    const vozes = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("pt"));
    voz = vozes.find(v => /pt-br/i.test(v.lang) && /google|natural|online/i.test(v.name))
       || vozes.find(v => /pt-br/i.test(v.lang)) || vozes[0] || null;
  };
  if ("speechSynthesis" in window) { escolherVoz(); speechSynthesis.onvoiceschanged = escolherVoz; }

  const falar = (frase) => new Promise((ok) => {
    if (!("speechSynthesis" in window)) return ok();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(frase);
    u.lang = "pt-BR"; if (voz) u.voice = voz; u.rate = 1.05;
    u.onend = u.onerror = () => ok();
    estado("falando");
    speechSynthesis.speak(u);
  });

  // ---------- bastidores
  const formatarArgs = (a) => Object.entries(a || {}).map(([k, v]) => `${k}: ${JSON.stringify(v)}`).join(", ");
  const item = (classe, nome, ms, detalhe) => {
    const li = document.createElement("li");
    li.className = `${classe} nova-chamada`;
    li.innerHTML = `<span class="nome"></span><span class="ms"></span>${detalhe ? '<span class="args"></span>' : ""}`;
    li.querySelector(".nome").textContent = nome;
    li.querySelector(".ms").textContent = `${ms} ms`;
    if (detalhe) li.querySelector(".args").textContent = detalhe;
    return li;
  };
  const mostrarRodada = (itens) => {
    vazio.hidden = true;
    lista.prepend(...itens);
    while (lista.children.length > 14) lista.lastChild.remove();
  };

  // ---------- conversa
  async function enviar(frase) {
    frase = frase.trim();
    if (!frase || ocupado) return;
    ocupado = true;
    cliente.classList.remove("parcial");
    cliente.textContent = `“${frase}”`;
    resposta.classList.remove("erro");
    estado("pensando");
    try {
      const r = await fetch("/api/conversa", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto: frase, sessao })
      });
      const dados = await r.json();
      if (!r.ok) throw new Error(dados.erro || `Erro ${r.status}`);
      sessao = dados.sessao;
      mostrarRodada([
        ...dados.chamadas.map(c => item(`ferramenta${c.ok ? "" : " falhou"}`, `tools/call: ${c.ferramenta}`, c.ms, formatarArgs(c.argumentos))),
        item("modelo", dados.modelo.startsWith("modo ensaio") ? "Modo ensaio: regras locais, sem Bedrock" : `Amazon Bedrock: ${dados.modelo.replace(/^(us|global)\./, "")}`, dados.ms_modelo, `tools/list em ${dados.ms_tools_list} ms, rodada completa em ${dados.ms_total} ms`),
      ]);
      resposta.textContent = dados.resposta;
      await falar(dados.resposta);
    } catch (e) {
      resposta.classList.add("erro");
      resposta.textContent = `Não consegui responder: ${e.message}`;
    } finally {
      ocupado = false;
      estado("parado");
    }
  }

  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const f = texto.value; texto.value = "";
    enviar(f);
  });

  $("nova").addEventListener("click", () => {
    if (sessao) fetch(`/api/conversa/${sessao}`, { method: "DELETE" }).catch(() => {});
    sessao = null;
    lista.innerHTML = ""; vazio.hidden = false;
    cliente.textContent = "";
    resposta.classList.remove("erro");
    resposta.textContent = "Olá! Toque no microfone e peça um horário.";
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    estado("parado");
  });

  // ---------- reconhecimento de voz
  const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, ouvindo = false;
  const semVoz = (msg) => { mic.disabled = true; mic.title = msg; $("dica").textContent = msg; };
  if (!Reconhecimento) {
    semVoz("Este navegador não reconhece voz. Abra no Google Chrome ou no Microsoft Edge, ou digite a fala.");
  } else if (navigator.brave) {
    // O Brave expõe a API mas bloqueia o serviço de reconhecimento: o microfone abre e fecha com erro "network".
    semVoz("O Brave não reconhece voz. Abra no Google Chrome ou no Microsoft Edge, ou digite a fala.");
  } else {
    rec = new Reconhecimento();
    rec.lang = "pt-BR"; rec.interimResults = true; rec.continuous = false;
    rec.onstart = () => { ouvindo = true; mic.setAttribute("aria-pressed", "true"); estado("ouvindo"); };
    rec.onend = () => { ouvindo = false; mic.setAttribute("aria-pressed", "false"); if (!ocupado) estado("parado"); };
    rec.onerror = (e) => {
      if (e.error === "not-allowed") $("dica").textContent = "Libere o microfone no navegador para falar.";
      else if (e.error === "network") $("dica").textContent = "O serviço de reconhecimento de voz do navegador não respondeu. Use o Google Chrome ou o Microsoft Edge, ou digite.";
      else if (e.error !== "no-speech" && e.error !== "aborted") $("dica").textContent = `Microfone: ${e.error}. Tente de novo ou digite.`;
    };
    rec.onresult = (e) => {
      let final = "", parcial = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        (e.results[i].isFinal ? (final += e.results[i][0].transcript) : (parcial += e.results[i][0].transcript));
      }
      if (parcial) { cliente.classList.add("parcial"); cliente.textContent = parcial; }
      if (final) enviar(final);
    };
  }
  const alternarMic = () => {
    if (!rec || ocupado) return;
    if (ouvindo) { rec.stop(); return; }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    try { rec.start(); } catch (_) {}
  };
  mic.addEventListener("click", alternarMic);
  document.addEventListener("keydown", (ev) => {
    if (ev.code === "Space" && document.activeElement !== texto && !ev.repeat) { ev.preventDefault(); alternarMic(); }
  });
})();
</script>
</body>
</html>
